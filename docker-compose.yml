services:
  app:
    build:
      context: .
      args:
        BASE_PATH: /splendor
    image: poke-splendor
    container_name: poke-splendor
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - BASE_PATH=/splendor
      - STATS_FILE=/data/stats.json
    volumes:
      # Persist the visitor counter across container rebuilds/redeploys.
      - poke-splendor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/splendor/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  poke-splendor-data:
